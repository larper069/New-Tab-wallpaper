<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<iframe id="wallpaper" sandbox="allow-scripts allow-same-origin"></iframe>

<!-- Optional clock overlay -->
<div id="overlay">
<div id="clock"></div>
<div id="date"></div>
</div>

<!-- Gear → opens editor popup -->
<button id="gear" title="Edit wallpaper">⚙</button>

<!-- Quick settings (no full editor, just toggles) -->
<div id="quick" class="closed">
<label><input type="checkbox" id="show-clock" checked> Show clock</label>
<label><input type="checkbox" id="clock-24" checked> 24h format</label>
<label>Dim <input type="range" id="dim" min="0" max="85" value="0"></label>
<button id="edit-btn">Open Editor</button>
</div>

<script src="newtab.js"></script>
</body>
</html>
